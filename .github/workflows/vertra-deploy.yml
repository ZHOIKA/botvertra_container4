name: Deploy Vertra Container 4

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VertraCloud deploy
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 2 \
            --max-time 30 \
            -X POST \
            "https://api.vertracloud.app/v1/apps/6006a50c-e999-4724-8f3c-3f9221a2c9fa/deploys/receiver/webhook"
